name: Build & Package

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

# ─────────────────────────────────────────────────────────────────────────────
#  Linux build
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc make curl \
            libsqlite3-dev \
            libgl-dev \
            libx11-dev libxrandr-dev libxi-dev \
            libxinerama-dev libxcursor-dev

      - name: Build
        run: make

      - name: Verify binary exists
        run: |
          echo "=== bin/ contents ==="
          ls -la bin/
          echo "=== Checking program binary ==="
          file bin/program

      - name: Download font for package
        run: |
          # Path must match an entry in assets/fonts.cfg, otherwise the app
          # silently falls back to raylib's built-in bitmap font.
          mkdir -p Font/Space_Mono
          curl -fsSL \
            "https://github.com/google/fonts/raw/main/ofl/spacemono/SpaceMono-Bold.ttf" \
            -o Font/Space_Mono/SpaceMono-Bold.ttf
          grep -qxF "Font/Space_Mono/SpaceMono-Bold.ttf" assets/fonts.cfg \
            || { echo "ERROR: downloaded font path is not listed in assets/fonts.cfg"; exit 1; }

      - name: Package
        run: |
          PKG=transcript-viewer-linux
          mkdir -p dist/$PKG
          cp bin/program        dist/$PKG/
          cp -r assets          dist/$PKG/
          cp -r Font            dist/$PKG/
          cp README.md          dist/$PKG/
          cp LICENSE.md         dist/$PKG/
          tar -czf $PKG.tar.gz -C dist $PKG
          echo "=== Package contents ==="
          tar -tzf $PKG.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: transcript-viewer-linux
          path: transcript-viewer-linux.tar.gz

# ─────────────────────────────────────────────────────────────────────────────
#  Windows build (MSYS2 MinGW64)
# ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      # install.ps1 is served raw from the default branch to `irm | iex`, so a
      # syntax error ships straight to users with no build step to catch it.
      # Parse it on a real Windows host before anything else runs.
      - name: Syntax-check install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error file=install.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
            exit 1
          }
          Write-Host "OK: install.ps1 parses cleanly."

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            make
            curl
            unzip
            zip
            file

      - name: Build
        run: make

      - name: Verify binary exists
        run: |
          echo "=== bin/ contents ==="
          ls -la bin/
          echo "=== Checking program.exe ==="
          file bin/program.exe
          file bin/program.exe | grep -q "PE32+ executable" \
            || { echo "ERROR: bin/program.exe is not a 64-bit Windows executable"; exit 1; }

      - name: Strip binary
        run: strip bin/program.exe

      - name: Verify no MinGW runtime DLLs are required
        run: |
          # The Windows link is fully static (-static in the Makefile), so the
          # .exe must only import DLLs that ship with Windows itself. Anything
          # from /mingw64/bin would have to be bundled — fail loudly instead of
          # shipping a package that dies with "libgcc_s_seh-1.dll not found".
          echo "=== DLLs imported by program.exe ==="
          objdump -p bin/program.exe | awk '/DLL Name/ {print $3}' | sort -u | tee imports.txt

          missing=0
          while read -r dll; do
            if [ -f "/mingw64/bin/$dll" ]; then
              echo "NON-SYSTEM DLL required: $dll"
              missing=1
            fi
          done < imports.txt

          if [ "$missing" -ne 0 ]; then
            echo "ERROR: program.exe depends on MinGW DLLs; the static link did not take effect."
            exit 1
          fi
          echo "OK: only Windows system DLLs are required."

      - name: Download font for package
        run: |
          # Path must match an entry in assets/fonts.cfg, otherwise the app
          # silently falls back to raylib's built-in bitmap font.
          mkdir -p Font/Space_Mono
          curl -fsSL \
            "https://github.com/google/fonts/raw/main/ofl/spacemono/SpaceMono-Bold.ttf" \
            -o Font/Space_Mono/SpaceMono-Bold.ttf
          grep -qxF "Font/Space_Mono/SpaceMono-Bold.ttf" assets/fonts.cfg \
            || { echo "ERROR: downloaded font path is not listed in assets/fonts.cfg"; exit 1; }

      - name: Package
        run: |
          PKG=transcript-viewer-windows
          mkdir -p dist/$PKG

          cp bin/program.exe     dist/$PKG/
          cp -r assets           dist/$PKG/
          cp -r Font             dist/$PKG/
          cp README.md           dist/$PKG/
          cp LICENSE.md          dist/$PKG/

          # program.exe resolves assets/ and Font/ relative to the working
          # directory, so launching it from anywhere but the extracted folder
          # loses the font and config. The .bat pins the cwd first.
          printf '%s\r\n' \
            '@echo off' \
            'cd /d "%~dp0"' \
            'start "" "%~dp0program.exe"' \
            > dist/$PKG/Run-Transcript-Viewer.bat

          printf '%s\r\n' \
            'Transcript Viewer - Windows' \
            '===========================' \
            '' \
            'EASIEST: skip this zip entirely. Open PowerShell and run:' \
            '' \
            '  irm https://raw.githubusercontent.com/'"$GITHUB_REPOSITORY"'/main/install.ps1 | iex' \
            '' \
            'That installs the app, adds a "ctt" command and a Start Menu entry,' \
            'and avoids the SmartScreen warning described at the bottom.' \
            '' \
            'MANUAL (this zip):' \
            '1. Extract this whole folder somewhere you can write to' \
            '   (Desktop or Documents - not straight from inside the .zip).' \
            '2. Right-click the .zip -> Properties -> tick "Unblock" BEFORE' \
            '   extracting, or Windows marks every extracted file as untrusted.' \
            '3. Double-click Run-Transcript-Viewer.bat' \
            '4. Enter your username and press Enter.' \
            '' \
            'Keep program.exe, assets\ and Font\ together in the same folder.' \
            'The app reads them using relative paths and writes db_<user>.db here.' \
            '' \
            'No extra installation is needed - all runtime libraries are compiled in.' \
            '' \
            'SmartScreen / antivirus warnings' \
            '--------------------------------' \
            'This build is not code-signed (a certificate costs money), and it is' \
            'a freshly-published file that Microsoft has never seen before. Those' \
            'two facts alone are enough to trigger:' \
            '' \
            '  * "Windows protected your PC"  -> click More info -> Run anyway.' \
            '  * A generic detection such as Trojan:Win32/Wacatac or Wacapew.' \
            '    This is a false positive on an unsigned, statically-linked C' \
            '    program. The full source is public; you can build it yourself.' \
            '' \
            'If a file is quarantined: Windows Security -> Virus & threat' \
            'protection -> Protection history -> Restore. Please also report the' \
            'false positive at https://www.microsoft.com/en-us/wdsi/filesubmission' \
            'so the detection is corrected for everyone.' \
            > dist/$PKG/README-WINDOWS.txt

          cd dist && zip -r ../$PKG.zip $PKG/
          cd ..

          echo "=== Package contents ==="
          unzip -l $PKG.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: transcript-viewer-windows
          path: transcript-viewer-windows.zip

# ─────────────────────────────────────────────────────────────────────────────
#  GitHub Release  (only on version tags: v1.0, v1.2.3, …)
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: transcript-viewer-linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: transcript-viewer-windows

      - name: Verify downloaded files
        run: |
          echo "=== Files ready for release ==="
          ls -lh transcript-viewer-linux.tar.gz
          ls -lh transcript-viewer-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Transcript Viewer ${{ github.ref_name }}"
          body: |
            ## Transcript Viewer ${{ github.ref_name }}

            ### Install (recommended)

            **Windows** — in PowerShell:
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```

            **Linux** — in a terminal:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            Both register a `ctt` command; Windows also gets a Start Menu entry.

            ### Manual download
            | Platform | File |
            |---|---|
            | Linux (x86-64) | `transcript-viewer-linux.tar.gz` |
            | Windows (x86-64) | `transcript-viewer-windows.zip` |

            1. Extract the archive to a writable folder (not straight from inside the .zip).
            2. Edit `assets/fonts.cfg` if you want a different font (Space Mono is bundled).
            3. Run `./program` (Linux) or double-click `Run-Transcript-Viewer.bat` (Windows).
            4. Enter your username and press **Enter**.

            Keep the binary next to `assets/` and `Font/` — they are loaded via relative paths.

            > **Windows — about the antivirus warning.** This build is not code-signed, and
            > every release is a brand-new file Microsoft has never seen, so SmartScreen may
            > say *"Windows protected your PC"* and Defender may report a generic detection
            > like `Trojan:Win32/Wacatac`. That is a **false positive** on an unsigned,
            > statically-linked C program — the source is public and reproducible.
            >
            > The PowerShell installer above avoids the SmartScreen prompt entirely, because
            > files fetched by `Invoke-WebRequest` are not tagged with the Mark-of-the-Web
            > the way browser downloads are. If you download the `.zip` manually instead,
            > right-click it → **Properties** → tick **Unblock** *before* extracting.
            >
            > If something gets quarantined, restore it from Windows Security → *Protection
            > history*, and please report it at
            > [Microsoft's submission portal](https://www.microsoft.com/en-us/wdsi/filesubmission)
            > so the detection is fixed for everyone.

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full setup and usage instructions.
          files: |
            transcript-viewer-linux.tar.gz
            transcript-viewer-windows.zip
          draft: false
          prerelease: false